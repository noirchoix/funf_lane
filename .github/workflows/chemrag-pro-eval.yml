name: ChemRAG Pro Evaluation Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rag/**"
      - "routes/**"
      - "app/**"
      - "scripts/eval_ci_gate.py"
      - "tests/eval/**"

jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Start ChemRAG API
        env:
          SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          VOYAGEAI_API_KEY: ${{ secrets.VOYAGEAI_API_KEY }}
          QDRANT_URL: http://127.0.0.1:6333
          DEFAULT_GENERATION_PROVIDER: deepseek
          DEFAULT_EMBED_PROVIDER: voyage
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > chemrag.log 2>&1 &
          sleep 10
      - name: Run retrieval regression gate
        env:
          SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
        run: |
          if [ ! -f tests/eval/golden_qa.jsonl ]; then
            echo "No tests/eval/golden_qa.jsonl found. Copy golden_qa.example.jsonl and replace expected IDs before enabling this gate."
            exit 0
          fi
          python scripts/eval_ci_gate.py --api-key "$SERVICE_API_KEY" --golden tests/eval/golden_qa.jsonl --mode hybrid_rerank --out artifacts/chemrag_eval_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chemrag-pro-eval-report
          path: |
            artifacts/chemrag_eval_report.json
            chemrag.log
